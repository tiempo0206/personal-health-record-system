<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Health Record System</title>
<!--
  ==========================================================================
  英文入口页 —— 双击本文件即可用英文启动系统
  ==========================================================================
  为什么不直接把 ?lang=en-US 写在 .bat 里？
  因为 Windows 的 start 命令需要**真实存在的文件路径**，而
  "index.html?lang=en-US" 不是一个存在的文件名，ShellExecute 会报
  「找不到文件」。用 file:/// 拼 URL 又要处理路径里的空格转义，
  在批处理里极易出错（旧版本就是因为这个原因打不开的）。

  于是改成：本页面不含任何查询串（路径一定有效），由它在浏览器里
  导航到 index.html?lang=en-US，把语言参数带过去。

  三种启动方式等价：
    · 双击 index_enUS.html
    · 双击 启动网站_enUS.bat
    · 浏览器地址栏直接打开 index.html?lang=en-US
  ==========================================================================
-->
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
         background: #f4f7fa; color: #0f1c2e; display: flex; align-items: center;
         justify-content: center; min-height: 100vh; margin: 0; }
  .box { text-align: center; padding: 32px; }
  .logo { width: 64px; height: 64px; border-radius: 14px; background: #0e7490;
          color: #fff; display: grid; place-items: center; font-size: 30px;
          margin: 0 auto 18px; }
  h1 { font-size: 20px; margin: 0 0 6px; font-weight: 650; }
  p { color: #48586e; font-size: 14px; margin: 0 0 16px; }
  a { color: #0e7490; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo" aria-hidden="true">🩺</div>
    <h1>Personal Health Record System</h1>
    <p>Starting in English…</p>
    <p><a href="index.html?lang=en-US">Click here if it does not start automatically.</a></p>
  </div>
  <script>
    /* 立刻跳转，把 ?lang=en-US 带给主应用 */
    location.replace('index.html?lang=en-US');
  </script>
</body>
</html>
