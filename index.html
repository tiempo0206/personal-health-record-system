<!--
  ==========================================================================
  个人健康档案管理系统 (PHR) —— 入口页面
  ==========================================================================
  【如何使用】直接双击本文件即可在浏览器中打开（无需安装依赖）。
               首次打开会自动写入一套示例数据，方便直接体验各项功能。

  【为什么不用 ES Module / 不用 fetch】
               本文件被设计为通过 file:// 协议直接打开，而浏览器出于安全策略
               会禁止 file:// 下的 ES Module 与 fetch 请求。因此本项目采用
               传统 <script> 标签 + 全局命名空间 window.PHR 的组织方式，
               保证"双击即用"。
               （通过本地服务 http://127.0.0.1 打开时，core/store.file.js 会用
                XMLHttpRequest 读写 data/database.json —— 那条路径只在 http 下走，
                file:// 下完全不执行，所以上面这条约束依然成立。）

  【脚本加载顺序】顺序严格不可调换，原因见每组注释。
  ==========================================================================
-->

<!-- 启动遮罩：脚本装配完成后由 core/boot.js 移除 -->
<div id="boot-screen">
  <div class="boot-logo" aria-hidden="true">🩺</div>
  <div class="boot-title" data-i18n="boot.title">个人健康档案管理系统</div>
  <div class="boot-sub" data-i18n="boot.subtitle">正在装配模块，请稍候…</div>
  <div class="boot-bar"><i></i></div>
</div>

<!-- 应用根节点：登录页或主框架都会渲染到这里 -->
<div id="app" role="application" data-i18n="boot.appAria" aria-label="个人健康档案管理系统"></div>

<!--
  尽早根据 URL 参数切换启动界面语言，避免英文启动器先看到中文。
  这里不依赖 i18n 词条表（词条表尚未加载），只做中英文硬切换。
-->
<script>
(function () {
  var m = String(location.search || '').match(/[?&]lang=([^&]+)/i);
  var en = m && /^en/i.test(decodeURIComponent(m[1]));
  if (!en) { return; }
  document.documentElement.setAttribute('lang', 'en');
  var title = document.querySelector('title');
  if (title) { title.textContent = 'Personal Health Record System'; }
  var desc = document.querySelector('meta[name="description"]');
  if (desc) { desc.setAttribute('content', 'Personal Health Record System — keep scattered health information secure, controllable, searchable and understandable.'); }
  var t = document.querySelector('#boot-screen .boot-title');
  if (t) { t.textContent = 'Personal Health Record System'; }
  var s = document.querySelector('#boot-screen .boot-sub');
  if (s) { s.textContent = 'Assembling modules, please wait…'; }
  var app = document.getElementById('app');
  if (app) { app.setAttribute('aria-label', 'Personal Health Record System'); }
})();
</script>

<noscript>
  <div style="max-width:560px;margin:80px auto;padding:24px;border:1px solid #e2e8f0;border-radius:14px;font-family:'Microsoft YaHei','Segoe UI',sans-serif">
    <h2 style="color:#b91c1c">需要启用 JavaScript / JavaScript Required</h2>
    <p>本系统是一个纯前端应用，所有功能都在您的浏览器中运行，因此必须启用 JavaScript 才能使用。</p>
    <p>This system is a pure frontend application; all functions run in your browser. Please enable JavaScript and refresh the page.</p>
    <p>请在浏览器设置中允许本页面运行 JavaScript，然后刷新页面。</p>
  </div>
</noscript>
